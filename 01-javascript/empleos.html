<!DOCTYPE html>
<html lang="es">

<head>
  <title>DevJobs - Empleos</title>
  <meta charset="UTF-8" />
  <meta name="description" content="Listado con empleos y filtros para encontrar el trabajo de tus sueños.">

  <link rel="stylesheet" href="./styles.css" />

  <script type="module" src="./main.js"></script>
</head>

<body>
  <header>
    <h1>
      <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      DevJobs
    </h1>

    <nav>
      <!-- <a href="">
        Inicio
      </a> -->
      <a href="">Empleos</a>
    </nav>

    <div>
      <devjobs-avatar service="github" username="Agus-dx" size="32">
      </devjobs-avatar>

      <devjobs-avatar service="google" username="netflix.com" size="32">
      </devjobs-avatar>

      <devjobs-avatar service="google" username="vercel.com" size="32">
      </devjobs-avatar>
    </div>
  </header>

  <main>
    <section class="jobs-search">
      <h1>Encuentra tu próximo trabajo</h1>
      <p>Explora miles de oportunidades en el sector tecnológico.</p>

      <form id="empleos-search-form" role="search">
        <div class="search-bar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-search">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
            <path d="M21 21l-6 -6" />
          </svg>

          <input name="search" id="empleos-search-input" required type="text"
            placeholder="Buscar trabajos, empresas o habilidades">
        </div>

        <div class="search-filters">
          <button type="button" id="button-technology" class="flex">
            <div id="button-technology-text">
              <span>Tecnologías</span>
            </div>
            <span>▼</span>
          </button>

          <div id="filter-technology" class="filter-technology is-hidden">
            <div class="filter-technology-radio">
              <div class="filter-technology-radio-option">
                <input type="radio" name="technology-op" id="filter-technology-any" value="any" checked>
                <label for="filter-technology-any">Al menos una tecnología</label>
              </div>
              <div class="filter-technology-radio-option">
                <input type="radio" name="technology-op" id="filter-technology-all" value="all">
                <label for="filter-technology-all">Todas las tecnologías</label>
              </div>
            </div>
            <div class="filter-technology-options">
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-js" value="javascript">
                <label for="tech-js">JavaScript</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-py" value="python">
                <label for="tech-py">Python</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-react" value="react">
                <label for="tech-react">React</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-node" value="node">
                <label for="tech-node">Node.js</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-java" value="java">
                <label for="tech-java">Java</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-csharp" value="csharp">
                <label for="tech-csharp">C#</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-c" value="c">
                <label for="tech-c">C</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-cplusplus" value="c++">
                <label for="tech-cplusplus">C++</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-ruby" value="ruby">
                <label for="tech-ruby">Ruby</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="tech-php" value="php">
                <label for="tech-php">PHP</label>
              </div>
              <div class="filter-technology-option">
                <input type="checkbox" name="technology" id="mobile" value="mobile">
                <label for="mobile">Mobile</label>
              </div>
            </div>
            <button id="apply-technology-filter">Filtrar</button>
          </div>

          <select name="location" id="filter-modalidad">
            <option value="">Ubicación</option>
            <option value="remoto">Remoto</option>
            <option value="cdmx">Ciudad de México</option>
            <option value="guadalajara">Guadalajara</option>
            <option value="monterrey">Monterrey</option>
            <option value="barcelona">Barcelona</option>
          </select>

          <select name="experience-level" id="filter-nivel">
            <option value="">Nivel de experiencia</option>
            <option value="junior">Junior</option>
            <option value="mid">Mid-level</option>
            <option value="senior">Senior</option>
            <option value="lead">Lead</option>
          </select>
        </div>
      </form>

      <span id="filter-selected-value"></span>
    </section>

    <section>
      <h2>Resultados de búsqueda</h2>

      <div class="jobs-listings">
      </div>

      <nav class="pagination" id="pagination-container">
      </nav>
    </section>
  </main>

  <footer style="padding-bottom: 2000px;">
    <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
  </footer>
</body>

</html>
